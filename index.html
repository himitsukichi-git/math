<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>MathJaxテスト</title>
  <script>
    MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
</head>
<body>
  <h1>MathJax の動作テスト</h1>

  <p>インライン数式の例：\\( x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a} \\)</p>

  <p>ブロック表示の例：</p>
  <p>$$E = mc^2$$</p>
</body>
</html>
