<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高校数学I：実数と平方根ドリル</title>

  <!-- TailwindCSS（デザイン用） -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ✅ MathJax 設定（本体より前に置く！） -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']], // インライン
        displayMath: [['$$', '$$'], ['\\[', '\\]']], // ブロック
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      },
      startup: {
        ready: () => {
          console.log('MathJax is ready!');
          MathJax.startup.defaultReady();
          document.getElementById('quiz-container')?.classList.remove('mathjax-loading');
          if (typeof startQuiz === 'function') startQuiz();
        }
      }
    };
  </script>

  <!-- ✅ MathJax 本体（設定の後に読み込む） -->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background-color: #f9fafb;
      color: #111827;
    }
    .answer-btn {
      transition: all 0.2s ease-in-out;
    }
    .answer-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .mathjax-loading {
      visibility: hidden;
    }
  </style>
</head>

<body class="p-8">
  <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-md p-8">
    <h1 class="text-2xl font-bold mb-4 text-center">高校数学I：実数と平方根ドリル</h1>
    <p class="mb-6 text-gray-600 text-center">MathJaxを使って数式を美しく表示するテストページ</p>

    <div id="quiz-container" class="mathjax-loading space-y-6">

      <!-- ✅ インライン数式の例 -->
      <p>インライン数式の例：半径$r$の円の面積は $S = \pi r^2$ です。</p>

      <!-- ✅ ブロック数式の例 -->
      <p>ブロック数式の例：</p>
      <p class="bg-gray-50 p-4 rounded-md">
        $$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$
      </p>

      <!-- ✅ クイズ風の例 -->
      <div class="p-4 border rounded-lg shadow-sm">
        <p class="font-semibold mb-2">問題：</p>
        <p>次の式を簡単にせよ：$$\sqrt{50}$$</p>
        <div class="mt-3 flex gap-3">
          <button class="answer-btn bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">5√2</button>
          <button class="answer-btn bg-gray-300 px-4 py-2 rounded-lg hover:bg-gray-400">10√5</button>
          <button class="answer-btn bg-gray-300 px-4 py-2 rounded-lg hover:bg-gray-400">25√2</button>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
