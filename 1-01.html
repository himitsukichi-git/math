<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>高校数学I：式の計算ドリル</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- MathJax の設定は読み込み前に置く（超重要） -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$','$$'], ['\\[','\\]']]
      },
      startup: {
        ready: () => {
          // 既定の初期化
          MathJax.startup.defaultReady();
          // クイズ本体を表示して開始
          document.getElementById('quiz-container')?.classList.remove('mathjax-loading');
          startQuiz();
        }
      }
    };
  </script>
  <!-- 必要な polyfill（古めのブラウザ対策）-->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <!-- MathJax v3 本体（asyncでOK。ただし上の設定を先に定義しておくこと）-->
  <script id="MathJax-script" async
          src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
    .answer-btn { transition: all 0.2s ease-in-out; }
    .answer-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .mathjax-loading { visibility: hidden; } /* MathJax準備完了まで非表示 */
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div id="quiz-container" class="w-full max-w-2xl bg-white rounded-xl shadow-lg p-6 md:p-8 mathjax-loading">
    <div id="progress-container" class="flex justify-between items-center mb-4">
      <h2 class="text-xl md:text-2xl font-bold text-gray-800">式の計算ドリル</h2>
      <div id="progress-text" class="text-sm font-semibold text-gray-600"></div>
    </div>

    <div class="w-full bg-gray-200 rounded-full h-2.5 mb-6">
      <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
    </div>

    <div id="question-card">
      <p id="question-text" class="text-lg md:text-xl text-gray-900 mb-6 min-h-[60px]"></p>
      <div id="answer-buttons" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <div id="feedback-container" class="mt-6 p-4 rounded-lg text-center hidden">
      <p id="feedback-text" class="font-semibold"></p>
    </div>

    <div class="mt-6 flex justify-end">
      <button id="next-btn" class="hidden bg-blue-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-blue-700 transition duration-200">次へ</button>
    </div>
  </div>

  <div id="results-container" class="hidden w-full max-w-2xl bg-white rounded-xl shadow-lg p-6 md:p-8 text-center">
    <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-4">終了！</h2>
    <p id="score-text" class="text-xl text-gray-700 mb-6"></p>
    <div id="results-summary" class="text-left space-y-4 mb-8"></div>
    <button id="restart-btn" class="bg-blue-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700 transition duration-200">もう一度挑戦する</button>
  </div>

  <script>
    // ==== データ ====
    const quizDataJson = {
      "Qm": [
        {"question":"次の式を計算しなさい。 $(3x^2 - 4x + 1) + (-x^2 + 5x - 2)$","hint":"同じ次数の項（同類項）ごとに係数を計算しましょう。","EE":[
          {"text":"$2x^2 + x - 1$","Ur":true,"w8":"各項の係数を正しく足し合わせています。"},
          {"text":"$4x^2 + x - 1$","Ur":false,"w8":"$x^2$の係数の計算で、符号の扱いに誤りがあります。"},
          {"text":"$2x^2 - 9x + 3$","Ur":false,"w8":"かっこを外す際に、第二項の符号をすべて逆にしてしまっています。"},
          {"text":"$2x^4 + x^2 - 1$","Ur":false,"w8":"同類項をまとめる際に、文字の次数も足してしまっています。"}]},
        {"question":"次の式を展開しなさい。 $(x - 3)(x + 5)$","hint":"分配法則を使って、一つ一つの項を丁寧にかけていきましょう。公式 $(x+a)(x+b)$ を使うと早いです。","EE":[
          {"text":"$x^2 - 2x - 15$","Ur":false,"w8":"定数項の和と積の計算が間違っています。"},
          {"text":"$x^2 + 2x - 15$","Ur":true,"w8":"各項を正しく分配法則に従って展開できています。"},
          {"text":"$x^2 + 2x + 15$","Ur":false,"w8":"定数項の積の符号を間違えています。"},
          {"text":"$x^2 - 15$","Ur":false,"w8":"xの項が抜けています。展開の公式 $(x+a)(x+b) = x^2 + (a+b)x + ab$ を思い出しましょう。"}]},
        {"question":"次の式を因数分解しなさい。 $x^2 + 6x + 8$","hint":"足して6になり、掛けて8になる2つの数字の組み合わせを探してみましょう。","EE":[
          {"text":"$(x + 2)(x + 4)$","Ur":true,"w8":"足して6、掛けて8になる2つの数を見つけられています。"},
          {"text":"$(x - 2)(x - 4)$","Ur":false,"w8":"掛けて+8になりますが、足して-6になってしまいます。"},
          {"text":"$(x + 1)(x + 8)$","Ur":false,"w8":"掛けて8になりますが、足して9になってしまいます。"},
          {"text":"$(x + 6)(x + 8)$","Ur":false,"w8":"問題の係数をそのまま使ってしまっています。因数分解の考え方を確認しましょう。"}]},
        {"question":"次の式を展開しなさい。 $(2a - 3b)^2$","hint":"乗法公式 $(x-y)^2 = x^2 - 2xy + y^2$ を利用しましょう。","EE":[
          {"text":"$4a^2 - 9b^2$","Ur":false,"w8":"これは $(x-y)(x+y)$ の展開と混同しています。 $(x-y)^2 = x^2 - 2xy + y^2$ を使いましょう。"},
          {"text":"$2a^2 - 6ab + 3b^2$","Ur":false,"w8":"各項を2乗する際に、係数の2乗を忘れています。"},
          {"text":"$4a^2 - 12ab + 9b^2$","Ur":true,"w8":"公式 $(x-y)^2 = x^2 - 2xy + y^2$ に正しく当てはめて計算できています。"},
          {"text":"$4a^2 + 12ab + 9b^2$","Ur":false,"w8":"中央の項の符号が違います。 $(2a - 3b)$ なので、-2xyの項はマイナスになります。"}]},
        {"question":"次の式を因数分解しなさい。 $9x^2 - 16y^2$","hint":"「2乗ひく2乗」の形になっています。因数分解の公式 $a^2 - b^2$ を思い出してみましょう。","EE":[
          {"text":"$(3x - 4y)^2$","Ur":false,"w8":"これは $(a-b)^2 = a^2 - 2ab + b^2$ の形ではありません。"},
          {"text":"$(3x - 4y)(3x + 4y)$","Ur":true,"w8":"公式 $a^2 - b^2 = (a-b)(a+b)$ を正しく利用できています。"},
          {"text":"$(9x - 16y)(x + y)$","Ur":false,"w8":"係数をそのまま使ってしまっています。$9x^2$ は $(3x)^2$ であることに注目しましょう。"},
          {"text":"$(3x + 4y)^2$","Ur":false,"w8":"これは $(a+b)^2 = a^2 + 2ab + b^2$ の形ではありません。"}]},
        {"question":"次の式を計算しなさい。 $(x^2 + 2x - 1)(x - 3)$","hint":"分配法則を使い、左のかっこの各項と右のかっこの各項を一つずつ掛け合わせましょう。最後に同類項をまとめます。","EE":[
          {"text":"$x^3 - x^2 - 7x + 3$","Ur":true,"w8":"各項を正しく分配法則で計算できています。"},
          {"text":"$x^3 + 5x^2 + 5x + 3$","Ur":false,"w8":"符号の計算に誤りがあります。特にマイナスの掛け算に注意しましょう。"},
          {"text":"$x^2 + 3x - 4$","Ur":false,"w8":"これは多項式の乗法ではなく、加法・減法の結果に近い形です。"},
          {"text":"$x^3 - x^2 + 5x - 3$","Ur":false,"w8":"同類項をまとめる際の計算に誤りがあります。"}]},
        {"question":"次の式を因数分解しなさい。 $3ax^2 - 12a$","hint":"まずは全ての項に共通する因数（共通因数）でくくり出すことから始めましょう。その後、かっこの中がさらに因数分解できないか考えます。","EE":[
          {"text":"$3a(x - 2)^2$","Ur":false,"w8":"展開すると $3a(x^2 - 4x + 4)$ となり、元の式と異なります。"},
          {"text":"$3(ax^2 - 4a)$","Ur":false,"w8":"まだ因数分解できる共通因数aが残っています。"},
          {"text":"$a(3x^2 - 12)$","Ur":false,"w8":"かっこの中がまだ因数分解できます。$3(x^2 - 4)$ となります。"},
          {"text":"$3a(x - 2)(x + 2)$","Ur":true,"w8":"まず共通因数 $3a$ でくくり、残った $x^2 - 4$ をさらに因数分解できています。"}]},
        {"question":"次の式を展開しなさい。 $(x+y-2)(x+y+2)$","hint":"同じ部分 $x+y$ を一つの文字（例えばA）に置き換えて考えてみましょう。すると、見慣れた乗法公式の形が見えてきませんか？","EE":[
          {"text":"$x^2 + 2xy + y^2 - 4$","Ur":true,"w8":"$x+y$ を一つの塊と見て、 $(A-2)(A+2)$ の形に展開できています。"},
          {"text":"$x^2 + y^2 - 4$","Ur":false,"w8":"$2xy$ の項が抜けています。 $(x+y)^2$ の展開を正しく行う必要があります。"},
          {"text":"$x^2 + 2xy + y^2 + 4$","Ur":false,"w8":"定数項の符号が間違っています。 $(A-2)(A+2) = A^2 - 4$ です。"},
          {"text":"$x^2 - y^2 - 4$","Ur":false,"w8":"符号の扱いが間違っています。$x+y$ をAと置いてみましょう。"}]},
        {"question":"次の式を因数分解しなさい。 $x^2 - 5xy + 4y^2$","hint":"$x^2 + (a+b)x + ab$ の公式を応用します。足して $-5y$、掛けて $4y^2$ となる2つの式を探しましょう。","EE":[
          {"text":"$(x - 2y)(x - 2y)$","Ur":false,"w8":"展開すると $x^2 - 4xy + 4y^2$ となり、中央の項の係数が異なります。"},
          {"text":"$(x + y)(x - 4y)$","Ur":false,"w8":"展開すると $x^2 - 3xy - 4y^2$ となり、符号が異なります。"},
          {"text":"$(x - y)(x - 4y)$","Ur":true,"w8":"足して $-5y$、掛けて $4y^2$ となる組み合わせを正しく見つけられています。"},
          {"text":"$(x - y)(x + 4y)$","Ur":false,"w8":"展開すると $x^2 + 3xy - 4y^2$ となり、符号が異なります。"}]},
        {"question":"次の式を因数分解しなさい。 $2x^2 + 5x - 3$","hint":"たすき掛けを使って考えてみましょう。掛けて2になるペアと、掛けて-3になるペアの組み合わせを探します。","EE":[
          {"text":"$(2x + 1)(x - 3)$","Ur":false,"w8":"展開すると $2x^2 - 5x - 3$ となり、中央の項の符号が逆になります。"},
          {"text":"$(2x - 1)(x + 3)$","Ur":true,"w8":"たすき掛けを正しく利用できています。$2 \\times 3 + (-1) \\times 1 = 5$ となります。"},
          {"text":"$(2x + 3)(x - 1)$","Ur":false,"w8":"展開すると $2x^2 + x - 3$ となり、中央の項の係数が異なります。"},
          {"text":"$(x + 1)(2x - 3)$","Ur":false,"w8":"展開すると $2x^2 - x - 3$ となり、中央の項の係数が異なります。"}]}
      ]};

    const questions = quizDataJson.Qm;
    const quizContainer = document.getElementById('quiz-container');
    const resultsContainer = document.getElementById('results-container');
    const questionTextEl = document.getElementById('question-text');
    const answerButtonsEl = document.getElementById('answer-buttons');
    const feedbackContainer = document.getElementById('feedback-container');
    const feedbackTextEl = document.getElementById('feedback-text');
    const nextBtn = document.getElementById('next-btn');
    const restartBtn = document.getElementById('restart-btn');
    const progressTextEl = document.getElementById('progress-text');
    const progressBarEl = document.getElementById('progress-bar');
    const scoreTextEl = document.getElementById('score-text');
    const resultsSummaryEl = document.getElementById('results-summary');

    let currentQuestionIndex = 0;
    let score = 0;
    let userAnswers = [];

    // MathJax startup.ready から呼ばれる
    function startQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      userAnswers = [];
      quizContainer.classList.remove('hidden');
      resultsContainer.classList.add('hidden');
      nextBtn.classList.add('hidden');
      showQuestion();
    }

    function showQuestion() {
      resetState();
      const currentQuestion = questions[currentQuestionIndex];

      progressTextEl.textContent = `問題 ${currentQuestionIndex + 1} / ${questions.length}`;
      progressBarEl.style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;

      // TeXを解釈させるために innerHTML を使用
      questionTextEl.innerHTML = currentQuestion.question;

      currentQuestion.EE.forEach(answer => {
        const button = document.createElement('button');
        button.innerHTML = answer.text;               // ← ここも innerHTML
        button.className =
          'answer-btn w-full p-4 border border-gray-300 rounded-lg text-left hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-400 disabled:opacity-50 disabled:cursor-not-allowed';
        button.dataset.correct = String(answer.Ur);
        button.dataset.rationale = answer.w8;
        button.addEventListener('click', selectAnswer);
        answerButtonsEl.appendChild(button);
      });

      renderMath();
    }

    function resetState() {
      feedbackContainer.classList.add('hidden');
      nextBtn.classList.add('hidden');
      while (answerButtonsEl.firstChild) answerButtonsEl.removeChild(answerButtonsEl.firstChild);
    }

    function selectAnswer(e) {
      const selectedBtn = e.target.closest('.answer-btn');
      if (!selectedBtn) return;

      const isCorrect = selectedBtn.dataset.correct === 'true';
      const rationale = selectedBtn.dataset.rationale;

      userAnswers.push({
        question: questions[currentQuestionIndex].question,
        selected: selectedBtn.innerHTML,
        isCorrect,
        correctAnswer: questions[currentQuestionIndex].EE.find(ans => ans.Ur).text
      });

      if (isCorrect) {
        score++;
        selectedBtn.classList.add('bg-green-100','border-green-500','ring-2','ring-green-400');
        feedbackContainer.classList.remove('bg-red-100','text-red-700');
        feedbackContainer.classList.add('bg-green-100','text-green-700');
      } else {
        selectedBtn.classList.add('bg-red-100','border-red-500','ring-2','ring-red-400');
        feedbackContainer.classList.remove('bg-green-100','text-green-700');
        feedbackContainer.classList.add('bg-red-100','text-red-700');
      }

      feedbackTextEl.innerHTML = rationale;
      feedbackContainer.classList.remove('hidden');
      renderMath();

      Array.from(answerButtonsEl.children).forEach(button => {
        if (button.dataset.correct === 'true') button.classList.add('bg-green-100','border-green-500');
        button.disabled = true;
      });

      progressBarEl.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

      nextBtn.textContent = (questions.length > currentQuestionIndex + 1) ? '次の問題へ' : '結果を見る';
      nextBtn.classList.remove('hidden');
    }

    function showResults() {
      quizContainer.classList.add('hidden');
      resultsContainer.classList.remove('hidden');
      scoreTextEl.textContent = `${questions.length}問中${score}問正解！`;

      resultsSummaryEl.innerHTML = '';
      userAnswers.forEach((ans, i) => {
        const div = document.createElement('div');
        div.className = `p-3 rounded-lg border ${ans.isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`;
        div.innerHTML = `
          <p class="font-semibold text-gray-800">問題 ${i + 1}: ${ans.question}</p>
          <p class="mt-2 text-sm ${ans.isCorrect ? 'text-green-800' : 'text-red-800'}">あなたの回答: ${ans.selected}</p>
          ${!ans.isCorrect ? `<p class="mt-1 text-sm text-blue-800">正解: ${ans.correctAnswer}</p>` : ''}`;
        resultsSummaryEl.appendChild(div);
      });
      renderMath();
    }

    function handleNext() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function renderMath() {
      // MathJax v3
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
    }

    nextBtn.addEventListener('click', handleNext);
    restartBtn.addEventListener('click', () => startQuiz());
  </script>
</body>
</html>
