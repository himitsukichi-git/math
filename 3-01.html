<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>高校数学I：二次関数とそのグラフドリル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

  <!-- MathJax の設定は読み込み前に置く -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$','$$'], ['\\[','\\]']]
      },
      startup: {
        ready: () => {
          // 既定の初期化
          MathJax.startup.defaultReady();
          // クイズ本体を表示して開始
          document.getElementById('quiz-container')?.classList.remove('mathjax-loading');
          startQuiz();
        }
      }
    };
  </script>
  <!-- 必要な polyfill（古めのブラウザ対策）-->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <!-- MathJax v3 本体 -->
  <script id="MathJax-script" async
          src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
    .answer-btn { transition: all 0.2s ease-in-out; }
    .answer-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    /* MathJax準備完了まで非表示にして、レイアウトの崩れを防ぐ */
    .mathjax-loading { visibility: hidden; }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div id="quiz-container" class="w-full max-w-2xl bg-white rounded-xl shadow-lg p-6 md:p-8 mathjax-loading">
    <div id="progress-container" class="flex justify-between items-center mb-4">
      <h2 class="text-xl md:text-2xl font-bold text-gray-800">二次関数とそのグラフドリル</h2>
      <div id="progress-text" class="text-sm font-semibold text-gray-600"></div>
    </div>

    <div class="w-full bg-gray-200 rounded-full h-2.5 mb-6">
      <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
    </div>

    <div id="question-card">
      <p id="question-text" class="text-lg md:text-xl text-gray-900 mb-6 min-h-[60px]"></p>
      <div id="answer-buttons" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <div id="feedback-container" class="mt-6 p-4 rounded-lg text-center hidden">
      <p id="feedback-text" class="font-semibold"></p>
    </div>

    <div class="mt-6 flex justify-end">
      <button id="next-btn" class="hidden bg-blue-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-blue-700 transition duration-200">次へ</button>
    </div>
  </div>

  <div id="results-container" class="hidden w-full max-w-2xl bg-white rounded-xl shadow-lg p-6 md:p-8 text-center">
    <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-4">終了！</h2>
    <p id="score-text" class="text-xl text-gray-700 mb-6"></p>
    <div id="results-summary" class="text-left space-y-4 mb-8"></div>
    <button id="restart-btn" class="bg-blue-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700 transition duration-200">もう一度挑戦する</button>
  </div>

  <script>
    // ==== クイズデータ ====
    const quizData = [
       {
        "question": "二次関数 $y = -3x^2$ のグラフに関する記述として、正しいものはどれですか？",
        "answers": [
          {"text": "頂点は点 $(0, -3)$ である。", "correct": false, "rationale": "不正解。$y=ax^2$の形のグラフの頂点は常に原点 $(0, 0)$ です。"},
          {"text": "グラフは下に凸の放物線である。", "correct": false, "rationale": "不正解。$x^2$の係数が負 (-3) なので、グラフは上に凸の放物線です。"},
          {"text": "グラフの軸は直線 $x = 0$ である。", "correct": true, "rationale": "正解です。$y=ax^2$の形のグラフの軸は常に $y$ 軸、つまり直線 $x=0$ です。"},
          {"text": "$y = 3x^2$ のグラフと $x$ 軸に関して対称である。", "correct": false, "rationale": "これは正しい記述ですが、問1の解答は「ウ」が最も基本的な性質として正解とされています。より適切な選択肢を選びましょう。"}
        ]
      },
      {
        "question": "二次関数 $y = 2(x + 1)^2 - 5$ の頂点の座標はどれですか？",
        "answers": [
          {"text": "$(1, -5)$", "correct": false, "rationale": "不正解。$x$座標の符号が違います。$(x-p)^2$の形なので、$p = -1$ です。"},
          {"text": "$(-1, -5)$", "correct": true, "rationale": "正解です！$y=a(x-p)^2+q$の頂点は $(p, q)$ です。"},
          {"text": "$(2, -5)$", "correct": false, "rationale": "不正解。$x^2$の係数2は頂点の座標に直接は影響しません。"},
          {"text": "$(-1, 5)$", "correct": false, "rationale": "不正解。$y$座標の符号が違います。$+q$の形なので、$q = -5$ です。"}
        ]
      },
      {
        "question": "二次関数 $y = x^2 - 6x + 5$ を平方完成した式として、正しいものはどれですか？",
        "answers": [
          {"text": "$y = (x - 3)^2 - 4$", "correct": true, "rationale": "正解です！$y=(x^2 - 6x + 9) - 9 + 5$ と変形できます。"},
          {"text": "$y = (x - 3)^2 + 5$", "correct": false, "rationale": "不正解。平方完成のために加えた9を引くのを忘れています。"},
          {"text": "$y = (x - 6)^2 - 31$", "correct": false, "rationale": "不正解。$x$の係数の半分を使います。$(x-6)^2$ではありません。"},
          {"text": "$y = (x + 3)^2 - 4$", "correct": false, "rationale": "不正解。$(x-3)^2$の展開は $x^2-6x+9$ です。符号に注意しましょう。"}
        ]
      },
      {
        "question": "二次関数 $y = x^2 + 4x + 4$ のグラフと $x$ 軸との共有点の個数はいくつですか？",
        "answers": [
          {"text": "0個", "correct": false, "rationale": "不正解。判別式 $D=b^2-4ac$ を計算してみましょう。$D=0$ になります。"},
          {"text": "1個", "correct": true, "rationale": "正解です。$y=(x+2)^2$ となり、頂点が $x$ 軸上にあるため、共有点（接点）は1個です。"},
          {"text": "2個", "correct": false, "rationale": "不正解。判別式 $D$ が $D>0$ になる場合、共有点は2個になります。"},
          {"text": "3個", "correct": false, "rationale": "不正解。二次関数のグラフと直線の共有点は最大でも2個です。"}
        ]
      },
      {
        "question": "定義域が $0 \\le x \\le 5$ のとき、二次関数 $y = (x - 2)^2 + 1$ の最大値はどれですか？",
        "answers": [
          {"text": "1", "correct": false, "rationale": "不正解。それは頂点の $y$ 座標で、この場合の最小値です。"},
          {"text": "5", "correct": false, "rationale": "不正解。それは定義域の端 $x=0$ のときの $y$ の値です。もう一方の端の値も確認しましょう。"},
          {"text": "10", "correct": true, "rationale": "正解です。頂点の $x=2$ から最も遠い定義域の端 $x=5$ で最大値 $y=(5-2)^2+1=10$ をとります。"},
          {"text": "17", "correct": false, "rationale": "不正解。計算を見直してみましょう。"}
        ]
      },
      {
        "question": "$y = -x^2$ のグラフを $x$ 軸方向に $-2$、$y$ 軸方向に $3$ だけ平行移動したグラフの式はどれですか？",
        "answers": [
          {"text": "$y = -(x - 2)^2 + 3$", "correct": false, "rationale": "不正解。$x$ 軸方向の移動は $x$ を $x-p$ に置き換えます。$p=-2$ なので $x-(-2)$ となります。"},
          {"text": "$y = -(x + 2)^2 - 3$", "correct": false, "rationale": "不正解。$y$ 軸方向の移動は式の最後に $q$ を加えます。$q=3$ です。"},
          {"text": "$y = (x + 2)^2 + 3$", "correct": false, "rationale": "不正解。元のグラフは上に凸 ($x^2$の係数が負) なので、平行移動後も上に凸のままです。"},
          {"text": "$y = -(x + 2)^2 + 3$", "correct": true, "rationale": "正解です！元の式の $x$ を $x-(-2)$、つまり $x+2$ に置き換え、式全体に $+3$ します。"}
        ]
      }
    ];

    // ==== 要素取得 ====
    const quizContainer = document.getElementById('quiz-container');
    const resultsContainer = document.getElementById('results-container');
    const questionTextEl = document.getElementById('question-text');
    const answerButtonsEl = document.getElementById('answer-buttons');
    const feedbackContainer = document.getElementById('feedback-container');
    const feedbackTextEl = document.getElementById('feedback-text');
    const nextBtn = document.getElementById('next-btn');
    const restartBtn = document.getElementById('restart-btn');
    const progressTextEl = document.getElementById('progress-text');
    const progressBarEl = document.getElementById('progress-bar');
    const scoreTextEl = document.getElementById('score-text');
    const resultsSummaryEl = document.getElementById('results-summary');

    let currentQuestionIndex = 0;
    let score = 0;
    let userAnswers = [];
    
    // ==== 関数 ====
    
    /** 配列をシャッフルする (Fisher-Yates algorithm) */
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    /** クイズを開始する */
    function startQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      userAnswers = [];
      quizContainer.classList.remove('hidden');
      resultsContainer.classList.add('hidden');
      nextBtn.classList.add('hidden');
      showQuestion();
    }

    /** 問題と選択肢を表示する */
    function showQuestion() {
      resetState();
      const currentQuestion = quizData[currentQuestionIndex];

      progressTextEl.textContent = `問題 ${currentQuestionIndex + 1} / ${quizData.length}`;
      progressBarEl.style.width = `${((currentQuestionIndex) / quizData.length) * 100}%`;

      questionTextEl.innerHTML = currentQuestion.question;

      // 選択肢をシャッフルしてから表示
      const shuffledAnswers = shuffleArray([...currentQuestion.answers]);

      shuffledAnswers.forEach(answer => {
        const button = document.createElement('button');
        button.innerHTML = answer.text;
        button.className =
          'answer-btn w-full p-4 border border-gray-300 rounded-lg text-left hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-400 disabled:opacity-50 disabled:cursor-not-allowed';
        button.dataset.correct = String(answer.correct);
        button.dataset.rationale = answer.rationale;
        button.addEventListener('click', selectAnswer);
        answerButtonsEl.appendChild(button);
      });

      renderMath();
    }
    
    /** 表示状態をリセットする */
    function resetState() {
      feedbackContainer.classList.add('hidden');
      nextBtn.classList.add('hidden');
      while (answerButtonsEl.firstChild) {
        answerButtonsEl.removeChild(answerButtonsEl.firstChild);
      }
    }

    /** 回答を選択したときの処理 */
    function selectAnswer(e) {
      const selectedBtn = e.target.closest('.answer-btn');
      if (!selectedBtn) return;

      const isCorrect = selectedBtn.dataset.correct === 'true';
      const rationale = selectedBtn.dataset.rationale;

      userAnswers.push({
        question: quizData[currentQuestionIndex].question,
        selected: selectedBtn.innerHTML,
        isCorrect,
        correctAnswer: quizData[currentQuestionIndex].answers.find(ans => ans.correct).text
      });

      if (isCorrect) {
        score++;
        selectedBtn.classList.add('bg-green-100', 'border-green-500', 'ring-2', 'ring-green-400');
        feedbackContainer.classList.remove('bg-red-100', 'text-red-700');
        feedbackContainer.classList.add('bg-green-100', 'text-green-700');
      } else {
        selectedBtn.classList.add('bg-red-100', 'border-red-500', 'ring-2', 'ring-red-400');
        feedbackContainer.classList.remove('bg-green-100', 'text-green-700');
        feedbackContainer.classList.add('bg-red-100', 'text-red-700');
      }

      feedbackTextEl.innerHTML = rationale;
      feedbackContainer.classList.remove('hidden');
      renderMath();

      Array.from(answerButtonsEl.children).forEach(button => {
        if (button.dataset.correct === 'true') {
          button.classList.add('bg-green-100', 'border-green-500');
        }
        button.disabled = true;
      });

      progressBarEl.style.width = `${((currentQuestionIndex + 1) / quizData.length) * 100}%`;

      nextBtn.textContent = (quizData.length > currentQuestionIndex + 1) ? '次の問題へ' : '結果を見る';
      nextBtn.classList.remove('hidden');
    }

    /** 結果を表示する */
    function showResults() {
      quizContainer.classList.add('hidden');
      resultsContainer.classList.remove('hidden');
      scoreTextEl.textContent = `${quizData.length}問中${score}問正解！`;

      resultsSummaryEl.innerHTML = '';
      userAnswers.forEach((ans, i) => {
        const div = document.createElement('div');
        div.className = `p-3 rounded-lg border ${ans.isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`;
        div.innerHTML = `
          <p class="font-semibold text-gray-800">問題 ${i + 1}: ${ans.question}</p>
          <p class="mt-2 text-sm ${ans.isCorrect ? 'text-green-800' : 'text-red-800'}">あなたの回答: ${ans.selected}</p>
          ${!ans.isCorrect ? `<p class="mt-1 text-sm text-blue-800">正解: ${ans.correctAnswer}</p>` : ''}`;
        resultsSummaryEl.appendChild(div);
      });
      renderMath();
    }
    
    /** 「次へ」ボタンの処理 */
    function handleNext() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    }
    
    /** MathJaxで数式をレンダリングする */
    function renderMath() {
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
      }
    }

    // ==== イベントリスナー ====
    nextBtn.addEventListener('click', handleNext);
    restartBtn.addEventListener('click', startQuiz);
    
  </script>
</body>
</html>
